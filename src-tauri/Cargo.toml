[package]
name = "shota"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The Microsoft Store updates apps itself and its policy requires that, so a
# Store build must not carry our updater — two mechanisms racing to install
# over each other is worse than either alone. Build it with
# `--no-default-features`, which drops the plugin, the tray entry and the
# check at launch together.
[features]
default = ["updater"]
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
xcap = "0.3"
image = "0.25"
base64 = "0.22"
font-kit = "0.14"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Screenshot work is all pixel-pushing inside dependencies (xcap's capture,
# image/png's encoder), and unoptimized those run 8-17x slower — measured on a
# 3840x2160 capture, the Rust half of a Ctrl+Shift+3 took ~1990ms at the Cargo
# default `opt-level = 0` versus ~234ms with this. That made `tauri dev` feel
# broken while release builds were fine, which is a trap worth not re-setting.
# Dependencies rarely rebuild, so paying full optimization for them costs one
# slow build; shota's own crate stays at 1 to keep incremental rebuilds quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }
